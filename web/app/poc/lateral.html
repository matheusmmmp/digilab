<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campo lateral</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6fb; font: 14px/1.3 system-ui, sans-serif; color: #3b3326; }
    #tela { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #vinheta { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 60%, rgba(30, 50, 40, 0.22) 100%); }
    #painel { position: fixed; left: 12px; top: 12px; background: rgba(255, 250, 236, 0.92); border-radius: 14px; padding: 10px 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15); display: grid; gap: 6px; max-width: min(320px, calc(100vw - 48px)); }
    #painel label { display: flex; gap: 8px; align-items: center; }
    #painel select { max-width: 200px; }
    #painel small { color: #7a6f5a; }
    #estado:empty { display: none; }
    @media (max-width: 600px) { #painel { font-size: 12px; } }
  </style>
</head>
<body>
  <canvas id="tela" role="img" aria-label="Um campo visto de lado, cenário 3D com o Digimon em sprite 2D"></canvas>
  <div id="vinheta"></div>
  <div id="painel">
    <strong>Campo lateral · POC</strong>
    <label>Digimon <select id="sprite"><option>carregando</option></select></label>
    <label>Kit <select id="kit"><option value="tff">RPG Tiny Fantasy Forest</option><option value="quaternius">Quaternius e Kenney (CC0)</option></select></label>
    <label><input id="pixel" type="checkbox"> pixelado (a cena em 300 linhas)</label>
    <small>A/D ou setas andam, W/S mudam de faixa, Shift corre, Espaço pula (bata no bloco). No celular: arraste para andar, toque para pular.</small>
    <small id="fps"></small>
    <small id="estado">carregando</small>
  </div>
  <script type="module" src="./lateral/pagina.ts"></script>
</body>
</html>
