<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Cassette Beasts</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; font: 14px/1.3 system-ui, sans-serif; color: #2b2b2b; }
    #tela { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #painel { position: fixed; left: 12px; top: 12px; background: rgba(255, 250, 236, 0.92); border-radius: 12px; padding: 10px 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15); display: grid; gap: 6px; max-width: min(340px, calc(100vw - 48px)); }
    #painel small { color: #6b6250; }
  </style>
</head>
<body>
  <canvas id="tela" role="img" aria-label="Um mapa do Cassette Beasts com o Digimon andando"></canvas>
  <div id="painel">
    <strong>Demo · mapa do Cassette Beasts</strong>
    <label>Mapa <select id="mapa" onchange="const p=new URLSearchParams(location.search);p.set('mapa',this.value);p.delete('x');p.delete('z');location.search=p">
      <option value="Clareira">Clareira do ovo (na floresta)</option><option value="EasthamWoods">Eastham Woods (floresta)</option><option value="Plains1">Plains1 (demo)</option></select></label>
    <label>Visual <select id="visual"><option value="neutro">neutro</option><option value="gba-hd">GBA HD (pixel 3×)</option><option value="hd-2d">HD-2D</option></select></label>
    <small>Assets do jogo, só locais (fora do git). WASD/setas, Shift corre; arrastar gira a câmera, a roda aproxima.</small>
    <small id="fps"></small>
    <small id="estado">carregando</small>
  </div>
  <script type="module" src="./cassette/pagina.ts"></script>
</body>
</html>
