<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ilha em voxel</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfeefc; font: 14px/1.3 system-ui, sans-serif; color: #3b3326; }
    #tela { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #painel { position: fixed; left: 12px; top: 12px; background: rgba(255, 250, 236, 0.92); border-radius: 14px; padding: 10px 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15); display: grid; gap: 6px; max-width: min(320px, calc(100vw - 48px)); }
    #painel label { display: flex; gap: 8px; align-items: center; }
    #painel select { max-width: 200px; }
    #painel input[type=number] { width: 90px; }
    #painel small { color: #7a6f5a; }
    #estado:empty { display: none; }
    @media (max-width: 600px) { #painel { font-size: 12px; } }
  </style>
</head>
<body>
  <canvas id="tela" role="img" aria-label="Uma ilha em voxels gerada por código, no estilo do Cube World, com o Digimon em sprite 2D"></canvas>
  <div id="painel">
    <strong>Ilha em voxel · POC</strong>
    <label>Digimon <select id="sprite"><option>carregando</option></select></label>
    <label>Semente <input id="semente" type="number" min="1" step="1"> <button id="gerar" type="button">Gerar</button></label>
    <label><input id="realce" type="checkbox" checked> pós-processamento (oclusão, bloom, tom de cor)</label>
    <label><input id="livre" type="checkbox"> câmera livre (sem seguir o Digimon)</label>
    <small>WASD/setas andam (relativo à câmera), Shift corre, Espaço pula; sobe um cubo sozinho. Arrastar gira a câmera, a roda aproxima.</small>
    <small id="fps"></small>
    <small id="estado">gerando</small>
  </div>
  <script type="module" src="./voxel/pagina.ts"></script>
</body>
</html>
