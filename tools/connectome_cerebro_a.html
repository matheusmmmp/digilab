<script>

  `(Dorkenwald et al. 2024). Vida de teste: <b>${D.meta.nome}</b>, pet ${D.meta.pet}, ${D.meta.dias} dias, ${N} decisões, S = ${S}.`;

// ---------------------------------------------------------------- pesos no tempo
const K = D.arestas.length;
const PASSO_CK = 50;
const checkpoints = [];
{
  let w = D.arestas.map(a => a.w0_ini);
  for (let n = 0; n < N; n++) {
    for (const [i, v] of D.decisoes[n].mud) w[i] = v;

// ---------------------------------------------------------------- layout
const W = 1400;

const svg = d3.select("#svg").attr("viewBox", `0 0 ${W} ${H}`);

  { lobo: "percepcao", x0: 20, x1: 330, nos: ent },
  { lobo: "impulsos", x0: 420, x1: 700, nos: reg },
  { lobo: "memoria_emocao", x0: 735, x1: 905, nos: lob.filter(n => n.lobo === "memoria_emocao"), y0: TOPO + 20, y1: TOPO + 130 },
  { lobo: "decisao", x0: 940, x1: 1385, nos: aco.concat(cla) },
];
if (lob.some(n => n.lobo === "planejamento")) regioes.push({ lobo: "planejamento", x0: 735, x1: 905, nos: [], y0: H - 175, y1: H - 60 });
const gReg = svg.append("g");
for (const r of regioes) {

// a camada acesa: os termos w·x/S da decisão n
function termosDaDecisao(dd) {

      const t = (wAgora[i] / S) * (xs[a.entrada] ?? 0);
      if (t !== 0) out.push({ i, a, t, x: xs[a.entrada] });
    } else if (a.tipo === "f" && dd.cands.includes("comer") && dd.pres && dd.pres.length) {

      const t = (wAgora[i] / S) * (dd.pres[j] || 0);
      if (t !== 0) out.push({ i, a, t, x: dd.pres[j] });

  if (!acenderSel.checked) { tabela([]); return; }

    .attr("stroke", o => o.t < 0 ? css("--menos") : (o.a.acao === dd.acao || o.alvo ? css("--ink") : css("--ink2")))
    .attr("stroke-opacity", o => (o.a.acao === dd.acao && (!o.alvo || o.a.classe === dd.alvo.alvo)) ? 0.9 : 0.35)
    .attr("stroke-width", o => Math.max(0.8, Math.min(10, Math.sqrt(Math.abs(o.t)) * 3.2)))
    .attr("filter", +css("--glow") ? "url(#brilho)" : null);
  // as ligações dos lobos que não são pesos: memória/emoção e o plano (tracejadas)

  (D.meta.receptores_novos || []).forEach((e, j) => xs[`e:${e}`] = dd.xc ? dd.xc[j] : 0);
  (D.meta.sociais || []).forEach((e, j) => xs[`e:${e}`] = dd.xs ? dd.xs[j] : 0);
  ["a", "b", "c"].forEach((fr, j) => xs[`e:presenca_${fr}`] = dd.pres ? (dd.pres[j] || 0) : 0);
  noSel.select("circle")
    .attr("fill-opacity", nd => nd.grupo === "entrada" ? 0.25 + 0.75 * Math.min(1, Math.abs(xs[nd.id] || 0))
      : nd.grupo === "acao" ? (dd.cands.includes(nd.rotulo) ? 1 : 0.25)
      : nd.grupo === "regra" ? (nd.rotulo === dd.regra ? 1 : 0.3)
      : nd.grupo === "classe" ? (dd.alvo && dd.alvo.classes && dd.alvo.classes.includes(nd.rotulo) ? 1 : 0.25) : 1)
    .attr("r", nd => (nd.id === `r:${dd.regra}` || nd.id === `a:${dd.acao}` || (dd.alvo && nd.id === `k:${dd.alvo.alvo}`)) ? 12
      : nd.grupo === "regra" ? 9 : nd.grupo === "lobo" ? 11 : 6)
    .attr("filter", nd => (+css("--glow") && (nd.id === `r:${dd.regra}` || nd.id === `a:${dd.acao}` || (dd.alvo && nd.id === `k:${dd.alvo.alvo}`))) ? "url(#brilho)" : null);
  tabela(ts.filter(o => !o.alvo));
}
function tabela(ts) {
  const top = ts.slice().sort((p, q) => Math.abs(q.t) - Math.abs(p.t)).slice(0, 10);
  d3.select("#tabela tbody").selectAll("tr").data(top).join("tr").html(o =>
    `<td>${o.a.entrada || ("fruta " + o.a.fruta)}</td><td>${o.a.acao || "comer"}</td><td class="n">${fmt(o.t)}</td><td class="n">${wAgora[o.i] - o.a.w0}</td>`);
}

// ---------------------------------------------------------------- painel da decisão
const barras = d3.select("#barras");
function painel() {
  const dd = D.decisoes[n];
  const h = Math.floor(dd.hora * 24), mi = Math.round((dd.hora * 24 - h) * 60);
  const linhas = [["decisão", `${dd.n + 1} de ${N}`], ["dia do pet e hora", `dia ${dd.dia + 1}, ${String(h).padStart(2, "0")}:${String(mi % 60).padStart(2, "0")}`],
    ["regra (impulsos)", dd.regra], ["candidatos", dd.cands.join(", ")], ["ação", `<b>${dd.acao}</b>`],
    ["lobo decisivo", `<span style="color:${corLobo(dd.decisivo)}">●</span> ${rot(dd.decisivo)}`], ["u do sorteio", dd.u === null ? "— (regra determinista)" : fmt(dd.u, 4)]];
  if (dd.alvo) linhas.push(["alvo", `${dd.alvo.alvo ?? "—"} <span style="color:var(--muted)">(padrão ${dd.alvo.padrao ?? "—"})</span>`]);
  if (dd.alvo_plano) linhas.push(["o plano mudou o alvo", dd.alvo_plano.decidiu ? "sim" : "não"]);
  if (dd.plano) linhas.push(["o plano mudou a ação", dd.plano.decidiu ? "sim" : "não"]);
  if (dd.sinal !== undefined) linhas.push(["sinal do corpo depois", dd.sinal]);
  document.getElementById("decisao").innerHTML = linhas.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  // barras empilhadas com sinal, uma por candidato
  const lobos = D.meta.lobos.filter(l => l !== "percepcao").concat(["piso"]);
  const largB = 300, alt = 22, esq = 96;
  barras.attr("viewBox", `0 0 ${largB + esq + 44} ${dd.cands.length * (alt + 8) + 18}`).attr("height", dd.cands.length * (alt + 8) + 18);
  let maxAbs = 0.5;
  for (const a of dd.cands) { let pos = 0, neg = 0; for (const l of lobos) { const v = (dd.contrib[l] || {})[a] || 0; v > 0 ? pos += v : neg += v; } maxAbs = Math.max(maxAbs, pos, -neg); }
  const xz = esq + largB * 0.25, esc = (largB * 0.75 - 4) / maxAbs;
  barras.selectAll("*").remove();
  barras.append("line").attr("x1", xz).attr("x2", xz).attr("y1", 0).attr("y2", dd.cands.length * (alt + 8)).attr("stroke", "var(--axis)");
  dd.cands.forEach((a, k) => {
    const y = k * (alt + 8);
    barras.append("text").attr("x", esq - 6).attr("y", y + alt / 2).attr("dy", "0.32em").attr("text-anchor", "end")
      .attr("font-size", 12).attr("font-weight", a === dd.acao ? 700 : 400).attr("fill", "var(--ink)").text(a);
    let pos = xz, neg = xz;
    for (const l of lobos) {
      const v = (dd.contrib[l] || {})[a] || 0;
      if (!v) continue;
      const wd = Math.abs(v) * esc;
      const x = v > 0 ? pos : neg - wd;
      if (v > 0) pos += wd + 2; else neg -= wd + 2;
      barras.append("rect").attr("x", x).attr("y", y).attr("width", Math.max(1, wd)).attr("height", alt).attr("rx", 3)
        .attr("fill", l === "piso" ? "var(--axis)" : corLobo(l)).append("title").text(`${l === "piso" ? "piso" : rot(l)}: ${fmt(v)}`);
    }
    barras.append("text").attr("x", pos + 4).attr("y", y + alt / 2).attr("dy", "0.32em").attr("font-size", 11.5)
      .attr("fill", "var(--ink2)").text(fmt(dd.pesos[a], 2));
  });
}

// ---------------------------------------------------------------- tamanho
{
  const t = C.pesos_total;
  const L = [["nós", C.nos], ["posições de peso", C.n_pesos_do_cerebro], ["não nulos no prior", t.nao_nulos_prior],
    ["não nulos no fim", t.nao_nulos_fim], ["não nulos em algum momento", t.nao_nulos_na_vida], ["aprendidos (w ≠ w0) no fim", t.aprendidos_fim],
    ["arestas da tabela acesas na vida", C.arestas_t_acesas_na_vida], ["decisões", C.decisoes]];
  document.getElementById("tamanho").innerHTML = L.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  document.getElementById("nota-vida").textContent = `Gerado de ${D.meta.config} (semente de teste ${D.meta.semente}), rejogado do log no disco e conferido bit a bit.`;
}

// ---------------------------------------------------------------- faixa e tocador
const faixa = d3.select("#faixa");
const FW = 1000;
faixa.attr("viewBox", `0 0 ${FW} 26`).attr("preserveAspectRatio", "none");
const bw = FW / N;
faixa.selectAll("rect.d").data(D.decisoes).join("rect").attr("class", "d").attr("x", (d, i) => i * bw).attr("y", 4).attr("width", Math.max(bw, 0.6)).attr("height", 18)
  .attr("fill", d => corLobo(d.decisivo)).attr("fill-opacity", d => d.cands.length > 1 ? 0.95 : 0.35);
D.decisoes.forEach((d, i) => { if (i > 0 && d.dia !== D.decisoes[i - 1].dia) faixa.append("line").attr("x1", i * bw).attr("x2", i * bw).attr("y1", 0).attr("y2", 26).attr("stroke", "var(--ink2)").attr("stroke-width", 1); });
const marca = faixa.append("rect").attr("y", 0).attr("height", 26).attr("width", Math.max(2, bw)).attr("fill", "none").attr("stroke", "var(--ink)").attr("stroke-width", 1.5);
document.getElementById("legenda-faixa").innerHTML = "lobo decisivo de cada decisão (claro: regra com um candidato só; traço: virada do dia) · " +
  D.meta.lobos.filter(l => l !== "percepcao").map(l => `<span><i class="sw" style="background:${corLobo(l)}"></i>${rot(l)}</span>`).join("");
faixa.on("click", ev => { const [x] = d3.pointer(ev); ir(Math.floor(x / FW * N)); });

const cursor = document.getElementById("cursor");
cursor.max = N - 1;
function ir(m) {
  n = Math.max(0, Math.min(N - 1, m));
  wAgora = pesosEm(n);
  cursor.value = n;
  document.getElementById("pos").textContent = `${n + 1}/${N}`;
  marca.attr("x", n * bw);
  desenharArestas(); desenharAcesa(); painel();
}
let timer = null;
const tocarBtn = document.getElementById("tocar");
function tocar() {
  if (timer) { clearInterval(timer); timer = null; tocarBtn.textContent = "▶"; tocarBtn.setAttribute("aria-label", "tocar"); return; }
  tocarBtn.textContent = "❚❚"; tocarBtn.setAttribute("aria-label", "pausar");
  timer = setInterval(() => { if (n >= N - 1) { tocar(); return; } ir(n + 1); }, 1000 / +document.getElementById("vel").value);
}
tocarBtn.onclick = tocar;
document.getElementById("vel").onchange = () => { if (timer) { tocar(); tocar(); } };
document.getElementById("ant").onclick = () => ir(n - 1);
document.getElementById("prox").onclick = () => ir(n + 1);
cursor.oninput = () => ir(+cursor.value);
modoSel.onchange = acenderSel.onchange = soRegra.onchange = () => { desenharArestas(); desenharAcesa(); };
document.addEventListener("keydown", ev => { if (ev.target.tagName === "SELECT" || ev.target.tagName === "INPUT" && ev.target.type !== "range") return;
  if (ev.key === "ArrowRight") ir(n + 1); else if (ev.key === "ArrowLeft") ir(n - 1); else if (ev.key === " ") { ev.preventDefault(); tocar(); } });

// ---------------------------------------------------------------- dicas
const tip = document.getElementById("tip");
function mostrar(ev, html) {
  const r = document.getElementById("grafo").getBoundingClientRect();
  tip.innerHTML = html; tip.style.display = "block";
  const x = Math.min(ev.clientX - r.left + 14, r.width - 330);
  tip.style.left = `${Math.max(4, x)}px`; tip.style.top = `${ev.clientY - r.top + 14}px`;
}
const esconder = () => tip.style.display = "none";
arestasSel.style("pointer-events", "visibleStroke").on("mousemove", function (ev, a) {
  const i = D.arestas.indexOf(a), w = wAgora[i];
  const alvo = a.tipo === "m" ? `${a.acao} → ${a.classe}` : a.tipo === "f" ? `fruta ${a.fruta} à vista → comer` : `${a.entrada} → ${a.acao}`;
  mostrar(ev, `<b>${alvo}</b>${a.regra ? `<br><span class="mu">regra</span> ${a.regra}` : ""}<br><span class="mu">w</span> ${w} · <span class="mu">w0</span> ${a.w0} · <span class="mu">Δ</span> ${w - a.w0}<br><span class="mu">w/S</span> ${fmt(w / S)} <span class="mu">(tabela ${a.tipo})</span>`);
}).on("mouseleave", esconder);
noSel.on("mousemove", (ev, nd) => mostrar(ev, `<b>${nd.rotulo}</b><br><span class="mu">lobo</span> ${rot(nd.lobo)} · <span class="mu">${nd.grupo}${nd.sub ? " / " + nd.sub : ""}</span>`)).on("mouseleave", esconder);

// começa numa decisão com escolha (mais de um candidato) para a primeira tela já mostrar o sorteio
ir(Math.max(0, D.decisoes.findIndex((d, i) => i > N / 2 && d.cands.length > 2)));
</script>
