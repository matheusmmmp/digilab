<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telas do celular · modelo novo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,800&amp;family=Pixelify+Sans:wght@700&amp;family=M+PLUS+Rounded+1c:wght@500;800&amp;display=swap" rel="stylesheet">
<style>
/* Pranchas do celular no modelo novo (pedido do Matheus de 2026-10-19, pela coordenação). A referência é
   D:\Trab\digilab\_ref\referencia_mobile_2026-10-19.png (fora do repositório): 5 telas de celular (Home com o número grande "01 HOME //",
   Parceiro com ID, nome e estágio e as ações em blocos coloridos, Treino, Exploração, Evolução em tela azul cheia), títulos em japonês com o
   subtítulo em português, fundo claro com grade e estilhaços azuis, navegação embaixo.
   Cobre as telas que o jogo tem hoje no celular (web/app/src, abaixo de 900 px), cada uma com o conteúdo que ela mostra. Os tokens, os ícones
   e o pet de reserva são os da TelasLayoutDesktop (branch v2-tela-pet), para o celular conversar com o desktop.
   Fora, por não terem dado no motor (marcado com "sem dado no motor" onde a referência mostra): Lv e XP, a barra de tempo do Treino, a
   Exploração com níveis e áreas trancadas (o mapa físico tem regiões, mas sem tela nem trancas), o sino.
   O pet é um placeholder vetorial; números e textos são exemplo de layout. Com ?tela=N mostra uma tela só, na largura do aparelho. */
/* ---- tokens: os do desktop do protótipo (TelasLayoutDesktop, worker A), para o celular conversar com ele */
:root{
  --bg:#eef3fa; --fg:#0d2147; --card:#ffffff; --primary:#1677ff; --primary-2:#0f5fe0; --secondary:#e8f0fc; --muted-fg:#5f7193; --border:#dbe6f5; --frame:#c9dcf4;
  --hunger:#f43f5e; --energy:#fbbf24; --mood:#1d8bf1; --health:#2dd4a7; --hyg:#6366f1; --dark:#7B3FB8; --pink:#ec4899; --violet:#8b5cf6;
  --sidebar:#0b2556; --evo:#0b3fa8; --evo-2:#0a2a78; --gold:#ffc61a;
  --shadow-sm:0 1px 3px rgba(13,33,71,.08),0 1px 2px rgba(13,33,71,.06); --shadow-md:0 6px 16px -6px rgba(13,33,71,.25);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:#dfe7f3;color:var(--fg);font-family:Nunito,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.jp{font-family:"M PLUS Rounded 1c",Nunito,sans-serif;font-weight:500}
p{margin:0}
button{font:inherit;color:inherit}

/* ---- o mapa: as telas lado a lado */
#mapa{display:flex;flex-wrap:wrap;gap:28px;padding:28px;align-items:flex-start}
.cel-rot{font:800 13px Nunito;color:#40567d;margin:0 0 8px 4px}
.cel-moldura{width:390px;height:844px;border-radius:34px;overflow:hidden;box-shadow:0 0 0 8px #0d2147,0 18px 40px -10px rgba(13,33,71,.45);position:relative;background:var(--bg)}
body.uma{background:var(--bg)}
body.uma #mapa{display:block;padding:0}
body.uma .cel-moldura{width:100%;height:auto;min-height:100vh;border-radius:0;box-shadow:none;overflow:visible}
body.uma .cel-rot{display:none}

/* ---- a tela */
.tela{position:relative;min-height:100%;display:flex;flex-direction:column;overflow:hidden}
.fundo{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fundo .grade{position:absolute;inset:0;opacity:.45;background-image:linear-gradient(to right,var(--border) 1px,transparent 1px),linear-gradient(to bottom,var(--border) 1px,transparent 1px);background-size:48px 48px}
.fundo b{position:absolute;display:block;background:var(--primary)}
.conteudo{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:12px;padding:0 16px 104px}

/* topo do Pet: a marca */
.marca{display:flex;align-items:center;gap:12px;padding:16px 16px 0;position:relative;z-index:1}
.marca .barras{display:flex;gap:4px;transform:skewX(-24deg)}
.marca .barras span{width:9px;height:36px;background:var(--fg)}
.marca .barras span:last-child{background:var(--primary)}
.marca .m{font:800 22px "Pixelify Sans",Nunito;letter-spacing:1.5px;line-height:1}
.marca .k{font-size:13px;line-height:1.2}
.marca .s{font:800 8.5px Nunito;letter-spacing:1.6px;color:var(--muted-fg);text-transform:uppercase;line-height:1.3}
.topo-dir{margin-left:auto;display:flex;align-items:center;gap:8px}
.bt-ic{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);flex:none}
.bt-ic svg{width:22px;height:22px}
.hora{display:flex;align-items:center;gap:6px}
.hora svg{color:var(--primary);width:22px;height:22px}
.hora .d{font-size:11.5px;color:var(--muted-fg);font-weight:700;line-height:1.1}
.hora .h{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}

/* o número grande da seção ("01 PET //") */
.secao{position:relative;z-index:1;padding:4px 16px 0;display:flex;align-items:flex-end;gap:10px;min-height:82px}
.secao .num{font:800 86px/0.8 Nunito;letter-spacing:-4px;color:transparent;-webkit-text-stroke:2px #b9cdeb;background:linear-gradient(180deg,rgba(185,205,235,.55),rgba(185,205,235,.15));-webkit-background-clip:text;background-clip:text}
.secao .rot{font:800 22px Nunito;letter-spacing:2px;color:#9db4d8;padding-bottom:4px}
.secao .rot i{font-style:normal;color:var(--primary)}

/* topo das telas internas: título em japonês e subtítulo em português */
.cab{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:16px 16px 6px}
.cab .voltar{width:40px;height:44px;display:flex;align-items:center;justify-content:center;margin-left:-8px}
.cab .voltar svg{width:24px;height:24px}
.cab .tt b{display:block;font:800 25px/1.1 "M PLUS Rounded 1c",Nunito;letter-spacing:1px}
.cab .tt small{display:block;font:800 12px Nunito;letter-spacing:2px;color:var(--muted-fg);text-transform:uppercase;margin-top:2px}
.cab .marca-num{position:absolute;right:132px;top:6px;z-index:-1;font:800 64px/1 Nunito;color:transparent;-webkit-text-stroke:1.5px #dce7f6;letter-spacing:-3px;pointer-events:none}

/* sub-abas: pílulas que rolam de lado dentro da faixa (a página não rola de lado) */
.abas{position:relative;z-index:1;display:flex;gap:6px;padding:4px 16px 8px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas a{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;padding:4px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.85);font:800 13px Nunito;color:#3b5079}
.abas a small{font-size:9.5px;color:var(--muted-fg);font-weight:500}
.abas a.ativo{background:var(--primary);border-color:var(--primary);color:#fff;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.abas a.ativo small{color:#d8e7ff}

/* módulo: tracinho azul, ícone, título e subtítulo em japonês */
.mod{position:relative;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.92);padding:10px 12px 12px;box-shadow:var(--shadow-sm)}
.mod>header{display:flex;align-items:center;gap:10px;padding:2px 0 10px}
.mod>header .tr{width:4px;height:26px;border-radius:999px;background:var(--primary);flex:none}
.mod>header .t b{display:block;font-size:16px;font-weight:800;line-height:1.15}
.mod>header .t small{display:block;font-size:10.5px;color:var(--muted-fg)}
.mod>header .dir{margin-left:auto;font-size:13px;font-weight:800;color:var(--primary);display:flex;align-items:center}
.mod>header .dir svg{color:var(--muted-fg);width:18px;height:18px}

/* barras */
.barras-est{display:flex;flex-direction:column;gap:10px}
.barras-est li{list-style:none;display:grid;grid-template-columns:22px 70px 1fr 54px;gap:8px;align-items:center;font-size:14px;font-weight:700}
.barras-est ul{margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.trilho{height:9px;border-radius:999px;background:#e5edf8;overflow:hidden}.trilho i{display:block;height:100%;border-radius:999px}
.v{font-size:13px;color:var(--muted-fg);text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

/* blocos de ação (os da referência: blocos coloridos de cantos suaves) */
.blocos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bloco{min-height:84px;border-radius:14px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:800;padding:8px 4px}
.bloco svg{width:28px;height:28px}
.bloco small{font-size:10px;font-weight:500;opacity:.8}
.c-rosa{background:#ffe4ee;color:#c0265e}.c-azul{background:#e2efff;color:#0f5fe0}.c-roxo{background:#ece8ff;color:#5b3fd1}.c-verde{background:#dcf8ee;color:#0d8a63}.c-ambar{background:#fff1d1;color:#a86400}.c-cinza{background:#eef2f8;color:#3b5079}
.bloco.prim{background:var(--primary);color:#fff;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);border-radius:0}

/* peças */
.cartao{border-radius:14px;border:1px solid var(--border);background:#fff;padding:12px}
.linha{display:flex;align-items:center;gap:12px}
.mini{font-size:12.5px;color:var(--muted-fg);font-weight:600}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--fg);font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.prim{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.gold{background:var(--gold);border-color:#e5ad00;color:#2a1d00}
.btn.larga{width:100%}
.etq{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;border:1.5px solid var(--fg);font:800 11px Nunito;letter-spacing:.8px;text-transform:uppercase}
.etq.azul{border-color:var(--primary);color:var(--primary)}
.etq.cheia{background:var(--primary);border-color:var(--primary);color:#fff}
.etq.cinza{border-color:#b9c6da;color:var(--muted-fg)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.95);border:1px solid var(--border);font-size:13px;font-weight:700;box-shadow:var(--shadow-sm)}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.sem-dado{border:1.5px dashed #9fb4d6;border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted-fg);font-weight:700;background:repeating-linear-gradient(135deg,rgba(159,180,214,.12) 0 8px,transparent 8px 16px)}
.sem-dado b{color:#3b5079}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:grid;grid-template-columns:44px 34px 1fr auto;gap:8px;align-items:center;min-height:46px;font-size:14px;font-weight:600;border-top:1px solid #edf2f9}
.lista li:first-child{border-top:0}
.lista time{font-size:12.5px;color:var(--muted-fg);font-variant-numeric:tabular-nums;font-weight:700}
.lista .q{width:32px;height:32px;border-radius:10px;background:var(--secondary);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.lista .q svg{width:17px;height:17px}
.tag{font:800 10px Nunito;letter-spacing:.8px;text-transform:uppercase;color:var(--primary);background:var(--secondary);border-radius:6px;padding:3px 6px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num-box{border-radius:12px;background:var(--secondary);padding:10px}
.num-box small{display:block;font-size:11.5px;color:var(--muted-fg);font-weight:700}
.num-box b{font-size:20px;font-weight:800}

/* o habitat (palco do pet) */
.habitat{position:relative;height:330px;border-radius:18px;overflow:hidden;border:1px solid var(--frame);background:linear-gradient(180deg,#f6f9ff 0%,#e7f0fd 60%,#d9e7fb 100%)}
.habitat::before{content:"";position:absolute;inset:0;opacity:.6;background-image:linear-gradient(60deg,transparent 49.3%,#dbe6f5 49.3% 50.7%,transparent 50.7%),linear-gradient(-60deg,transparent 49.3%,#dbe6f5 49.3% 50.7%,transparent 50.7%);background-size:56px 96px}
.habitat .anel{position:absolute;left:50%;bottom:44px;width:230px;height:56px;margin-left:-115px;border-radius:50%;border:5px solid #bcd6f7;background:rgba(255,255,255,.55)}
.habitat .pet{position:absolute;left:50%;bottom:66px;transform:translateX(-50%)}
.habitat .flut{position:absolute;display:flex;align-items:center;gap:8px}
.balao{position:absolute;background:#fff;border:2px solid var(--fg);border-radius:14px;padding:8px 12px;text-align:center;box-shadow:var(--shadow-md)}
.balao b{display:block;font-size:15px;font-weight:800}.balao small{font-size:11.5px;color:var(--muted-fg)}
.balao::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--fg);border-bottom:0}

/* barra de baixo */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.97);border-top:1px solid var(--border);box-shadow:0 -6px 20px -10px rgba(13,33,71,.25);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 8px 18px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:12.5px;font-weight:800;color:#6f80a0;border-radius:12px}
.nav a svg{width:24px;height:24px}
.nav a small{font-size:9px;font-weight:500}
.nav a.ativo{color:#fff;background:var(--primary);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.nav .alca{position:absolute;left:50%;bottom:6px;width:120px;height:4px;margin-left:-60px;border-radius:3px;background:#0d2147;opacity:.85}

/* tela cheia azul (evolução) */
.evo{background:radial-gradient(120% 70% at 50% 55%,#1d6bff 0%,var(--evo) 45%,var(--evo-2) 100%);color:#fff}
.evo .fundo .grade{opacity:.18;background-image:linear-gradient(to right,#7fb0ff 1px,transparent 1px),linear-gradient(to bottom,#7fb0ff 1px,transparent 1px)}
.evo .fundo b{background:#6fb6ff}

</style>
</head>

    ${cab("紋章", "Escolha seu brasão", "", { dir: "" })}<div class="conteudo" style="padding-bottom:20px">
    ${mod("relogio" in P ? "relogio" : "info", "Ritmo", "リズム", `<div class="cols2"><button class="cartao" style="border:2px solid var(--primary);text-align:left"><b>Rápido</b><br><span class="mini">3 h · 12 h · 18 h por estágio</span></button><button class="cartao" style="text-align:left"><b>Clássico</b><br><span class="mini">o ritmo de antes</span></button></div>`)}
    <div class="cols2">${b("Coragem", "#ffd2b3", "Koromon", "Agumon ou Guilmon", 1)}${b("Amizade", "#cfe3ff", "Tsunomon", "Gabumon ou …")}${b("Conhecimento", "#e6dccf", "Motimon", "Tentomon ou …")}${b("Sinceridade", "#d9f2c8", "Tanemon", "Palmon ou …")}</div>
    <button class="btn prim larga">Chocar o ovo de Coragem</button><button class="btn larga">Voltar</button>
  </div>`, { semNav: 1 });
}

/* ---------- 20. Ovo chocando */
function tOvo() {
  return tela("pet", `<div class="marca"><div class="barras"><span></span><span></span><span></span></div><div><div class="m">DIGILAB</div><div class="k jp">デジラボ</div></div></div>
    <div class="secao"><span class="num" aria-hidden="true">00</span><span class="rot">OVO <i>//</i></span></div>
    <div class="conteudo">
      <div class="habitat" style="height:470px">
        <span style="position:absolute;left:50%;top:170px;width:230px;height:230px;margin-left:-115px;border-radius:50%;border:10px dashed rgba(22,119,255,.35)"></span>
        <span style="position:absolute;left:50%;top:205px;margin-left:-55px;width:110px;height:140px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:#ffd2b3;border:3px solid #173a8a;transform:rotate(-6deg)"></span>
        <span class="chip" style="position:absolute;left:50%;top:24px;transform:translateX(-50%);font-weight:800">${ic("estrela")}chocando…</span>
        <div class="cartao" style="position:absolute;left:12px;right:12px;bottom:12px;text-align:center"><b style="font-size:18px">Digi-Egg de Coragem</b><br><span class="mini">o ovo balança e o anel gira; quando acaba, nasce Koromon</span></div></div>
      ${semDado("um estágio de ovo com cuidados: o ovo é só a animação de chocar (16 quadros)")}
    </div>`, { semNav: 1 });
}

/* ---------- 21. Evolução (a revelação, tela cheia azul) */
function tRevelacao() {
  return tela("pet", `<div class="conteudo" style="padding:28px 20px 24px;color:#fff;align-items:center;text-align:center">
    <div style="align-self:stretch;text-align:left;font:800 10px Nunito;letter-spacing:2px;color:#9cc7ff">ROOKIE → CHAMPION</div>
    <div class="jp" style="font:800 64px/1 'M PLUS Rounded 1c';margin-top:18px;text-shadow:0 4px 0 #0a2a78,0 0 24px rgba(111,182,255,.8)">進化!</div>
    <div style="font:800 italic 32px Nunito;letter-spacing:1px;text-shadow:0 3px 0 #0a2a78">EVOLUÇÃO!</div>
    <div style="position:relative;width:280px;height:280px;margin-top:18px;display:flex;align-items:center;justify-content:center">
      <span style="position:absolute;inset:10px;border-radius:50%;border:8px dashed rgba(143,195,255,.55)"></span><span style="position:absolute;inset:50px;border-radius:50%;background:radial-gradient(rgba(170,215,255,.7),transparent 70%)"></span>
      <span style="position:absolute;bottom:20px;width:220px;height:46px;border-radius:50%;border:4px solid #8fc3ff;box-shadow:0 0 22px #6fb6ff"></span>${pet(170, "#cfdaf0", "")}</div>
    <div style="border:2px solid #8fc3ff;border-radius:14px;background:rgba(10,42,120,.7);padding:10px 34px;margin-top:6px"><b style="font-size:22px;letter-spacing:1px">GREYMON</b><br><span style="color:#cfe3ff">Champion</span></div>
    <div style="display:flex;gap:6px;margin-top:14px;font-size:12px;color:#cfe3ff">Koromon › Agumon › <b style="color:#fff">Greymon</b> › ?</div>
    <div style="align-self:stretch;margin-top:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 12px;text-align:left"><b>Por que Greymon?</b>
      <div style="display:grid;grid-template-columns:70px 1fr;gap:6px 8px;align-items:center;margin-top:8px;font-size:12.5px">${[["cuidado", 72], ["caráter", 55], ["vínculo", 64]].map(([r, v]) => `<span>${r}</span><span class="trilho" style="background:rgba(255,255,255,.2)"><i style="width:${v}%;background:#8fe3ff"></i></span>`).join("")}</div></div>
    <button class="btn gold larga" style="margin-top:16px;min-height:52px;font-size:17px">Continuar ${ic("seta")}</button>
  </div>`, { cls: "evo", semNav: 1 });
}

/* ---------- 22. Morte */
function tMorte() {
  return tela("pet", `<div class="marca"><div class="barras"><span></span><span></span><span></span></div><div><div class="m">DIGILAB</div><div class="k jp">デジラボ</div></div></div>
    <div class="secao"><span class="num" aria-hidden="true">01</span><span class="rot">PET <i>//</i></span></div>
    <div class="conteudo">
      <div class="habitat" style="height:300px;filter:grayscale(1);opacity:.7"><span class="anel"></span><span class="pet">${pet(140)}</span></div>
      <div class="cartao" style="text-align:center;padding:18px"><b style="font-size:20px">Agumon se foi</b><p class="mini" style="margin:6px 0 14px;font-size:13.5px">a lesão ficou sem tratamento por tempo demais</p><button class="btn prim larga">Chocar um ovo novo</button></div>
      <p class="mini" style="text-align:center">os chamados e as ações somem; o registro continua no Diário</p>
    </div>`);
}

const TELAS = [
  ["Pet", tPet], ["Meus pets", tMeusPets], ["Crescer · Treinar", tTreinar], ["Crescer · Aprendizado (v11)", tAprend], ["Crescer · Evolução", tEvolucao], ["Crescer · Itens", tItens],
  ["Lutar · Arena", tArena], ["Lutar · Campanha", tCampanha], ["Lutar · Fronteira", tFronteira], ["Lutar · Medalhas", tMedalhas], ["Luta em andamento", tLuta], ["Resultado da luta", tResultado],
  ["Diário · Registro", tRegistro], ["Diário · Catálogo", tCatalogo], ["Diário · Gerações", tGeracoes], ["Diário · Cenários", tCenarios],
  ["Conversar", tConversar], ["Ajustes", tAjustes], ["Escolha do brasão", tBrasao], ["Ovo chocando", tOvo], ["Evolução", tRevelacao], ["Morte (v4+)", tMorte],
];
const q = new URLSearchParams(location.search).get("tela");
const alvo = document.getElementById("mapa");
if (q !== null) { document.body.classList.add("uma"); alvo.innerHTML = `<div class="cel-moldura">${TELAS[+q][1]()}</div>`; }
else alvo.innerHTML = TELAS.map(([n, f], i) => `<div><p class="cel-rot">${String(i + 1).padStart(2, "0")} · ${n}</p><div class="cel-moldura">${f()}</div></div>`).join("");

</script>
