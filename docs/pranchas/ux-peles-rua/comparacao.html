<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=1920">
<title>Peles de rua · as cinco lado a lado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Saira+Stencil+One&family=Barlow:wght@500;600;700;800&family=Rubik:ital,wght@0,500;0,700;0,800;0,900;1,700;1,800;1,900&family=DotGothic16&family=Bungee&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:950px}
/* a prancha de comparacao nao e de modelo nenhum: preto, branco e cinza, sem cor de pele */
body{background:#111;color:#fff;font:500 15px/1.3 "Barlow",system-ui,sans-serif;padding:26px 30px;display:flex;flex-direction:column;gap:14px}
h1{font:800 26px/1 "Barlow",sans-serif;letter-spacing:.02em}
h1 small{font:500 16px/1 "Barlow",sans-serif;color:#bbb;margin-left:14px}
.grade{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;flex:1;min-height:0}
.cmp{display:flex;flex-direction:column;gap:8px;min-width:0}
.recorte{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;outline:2px solid #555}
.cmp.novo .recorte{outline-color:#fff}
.recorte img{position:absolute;right:0;top:0;height:108%;width:auto}
figcaption b{display:block;font:800 19px/1.1 "Barlow",sans-serif}
figcaption span{display:block;color:#bbb;font-size:14px}
.baixo{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;height:140px}
.baixo .recorte img{right:auto;left:0;top:0;height:680%}
</style></head><body>
<h1>As peles lado a lado<small>o mesmo canto da tela do pet (o relógio e as janelas) e, embaixo, o cartão do pet e a linha do agora</small></h1>
<div class="grade"><figure class="cmp"><span class="recorte"><img src="img/hoje_vidro.jpg" alt=""></span><figcaption><b>Vidro (hoje)</b><span>a pele padrão do jogo</span></figcaption></figure><figure class="cmp"><span class="recorte"><img src="img/hoje_militar.jpg" alt=""></span><figcaption><b>Militar (hoje)</b><span>a outra pele do jogo</span></figcaption></figure>
<figure class="cmp novo"><span class="recorte"><img src="capturas/estencil_pet_limpa.jpg" alt=""></span><figcaption><b>1 · Estêncil</b><span>cartaz de rua</span></figcaption></figure><figure class="cmp novo"><span class="recorte"><img src="capturas/zine_pet_limpa.jpg" alt=""></span><figcaption><b>2 · Zine</b><span>colagem de papel</span></figcaption></figure>
<figure class="cmp novo"><span class="recorte"><img src="capturas/arcade_pet_limpa.jpg" alt=""></span><figcaption><b>3 · Arcade</b><span>adesivo e pixel</span></figcaption></figure></div>
<div class="baixo"><span class="recorte"><img src="img/hoje_vidro.jpg" alt=""></span><span class="recorte"><img src="img/hoje_militar.jpg" alt=""></span><span class="recorte"><img src="capturas/estencil_pet_limpa.jpg" alt=""></span><span class="recorte"><img src="capturas/zine_pet_limpa.jpg" alt=""></span><span class="recorte"><img src="capturas/arcade_pet_limpa.jpg" alt=""></span></div>
</body></html>
